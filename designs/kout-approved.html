<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AlJaiker — كوت — Approved Design</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --felt:#1B5E38;--felt-dk:#0F3D24;--felt-lt:#256B45;
  --crimson:#C8102E;--gold:#D4A420;--gold-lt:#F2D060;--jet:#1A1210;
  --ivory:#F8F2E4;--ivory-dk:#EDE3D0;--ivory-mid:#E0D4BC;
  --sage:#4A7C5A;--purple:#5B3FA6;--blue:#0077B6;
  --r:14px;--rs:10px;
}
body{background:#1A1A1A;font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif;padding:24px 16px 80px;direction:rtl;}
.screens{display:flex;flex-direction:column;gap:56px;max-width:390px;margin:0 auto;}
.screen-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;font-weight:700;direction:ltr;}
.screen{background:var(--felt-dk);border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.65);}
.topbar{background:var(--felt);padding:14px 14px 12px;display:flex;align-items:center;gap:10px;}
.back-btn{width:30px;height:30px;background:rgba(255,255,255,.1);border-radius:50%;border:none;color:var(--ivory);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-center{flex:1;}
.tb-title{font-size:15px;font-weight:700;color:var(--ivory);}
.tb-sub{font-size:10px;color:rgba(248,242,228,.45);margin-top:1px;}
.kout-badge{background:var(--crimson);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;color:white;flex-shrink:0;}
.target-toggle{display:flex;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden;flex-shrink:0;}
.tg-btn{padding:5px 12px;font-size:11px;font-weight:800;border:none;cursor:pointer;background:transparent;color:rgba(248,242,228,.5);}
.tg-btn.sel{background:white;color:var(--crimson);}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;flex-shrink:0;}
.c1{background:#C8102E;}.c2{background:#1B5E38;}.c3{background:#D4A420;color:var(--jet)!important;}.c4{background:#5B3FA6;}

/* SCREEN 1 */
.s1-body{padding:16px 14px 20px;}
.setup-q{font-size:13px;font-weight:700;color:rgba(248,242,228,.7);margin-bottom:10px;}
.count-row{display:flex;gap:7px;margin-bottom:20px;}
.count-btn{flex:1;background:var(--ivory);border:2.5px solid transparent;border-radius:var(--rs);padding:11px 4px;text-align:center;cursor:pointer;}
.count-btn.sel{background:rgba(27,94,56,.08);border-color:var(--felt);}
.cb-num{font-size:22px;font-weight:900;color:var(--jet);display:block;line-height:1;}
.cb-label{font-size:9px;color:#AAA;margin-top:2px;display:block;}
.count-btn.sel .cb-num{color:var(--felt);}
.saved-label{font-size:10px;font-weight:700;color:rgba(248,242,228,.4);letter-spacing:.5px;margin-bottom:8px;}
.saved-teams-row{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
.saved-team-chip{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;flex-shrink:0;cursor:pointer;text-align:center;}
.stc-name{font-size:12px;font-weight:700;color:var(--ivory);display:block;}
.stc-players{font-size:9px;color:rgba(248,242,228,.4);margin-top:2px;display:block;}
.saved-team-chip.sel-chip{border-color:var(--crimson);background:rgba(200,16,46,.12);}
.saved-team-chip.sel-chip .stc-name{color:var(--crimson);}
.team-section{background:rgba(0,0,0,.15);border-radius:var(--rs);padding:12px;margin-bottom:12px;}
.team-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.team-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.team-name-input{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--ivory);font-family:inherit;text-align:right;}
.team-name-input::placeholder{color:rgba(248,242,228,.3);}
.player-row{background:var(--ivory);border-radius:8px;display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;}
.pr-input{flex:1;background:transparent;border:none;font-size:14px;font-weight:600;color:var(--jet);font-family:inherit;text-align:right;}
.pr-input::placeholder{color:#BBB;}
.diwanya-hint{font-size:9px;color:rgba(248,242,228,.3);margin-top:6px;text-align:center;}
.add-player-btn{width:100%;background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.15);border-radius:8px;padding:9px;color:rgba(248,242,228,.4);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit;}
.save-team-row{display:flex;justify-content:center;margin-top:6px;}
.save-team-btn{background:transparent;border:none;color:rgba(248,242,228,.3);font-size:11px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
.start-btn{background:var(--felt);color:white;border:none;width:100%;padding:16px;font-size:16px;font-weight:700;cursor:pointer;}

/* SCREEN 2 */
.s2-body{padding:16px 14px 20px;}
.hakim-pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.hakim-chip{display:flex;align-items:center;gap:6px;background:var(--ivory);border-radius:20px;padding:6px 12px 6px 6px;cursor:pointer;border:2.5px solid transparent;}
.hakim-chip.sel-a{border-color:var(--crimson);background:rgba(200,16,46,.08);}
.hc-name{font-size:12px;font-weight:700;color:var(--jet);}
.hc-team{font-size:9px;color:#AAA;}
.hakim-chip.sel-a .hc-name{color:var(--crimson);}
.bid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:20px;}
.bid-btn{background:var(--ivory);border:2.5px solid transparent;border-radius:var(--rs);padding:14px 4px;text-align:center;cursor:pointer;}
.bid-btn.sel{background:rgba(200,16,46,.08);border-color:var(--crimson);}
.bb-num{font-size:22px;font-weight:900;color:var(--jet);display:block;line-height:1;}
.bid-btn.sel .bb-num{color:var(--crimson);}
.bid-btn.mulzum .bb-num{font-size:14px;font-weight:800;}
.result-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.result-btn{border:2.5px solid transparent;border-radius:var(--rs);padding:20px 10px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.result-btn.win{background:rgba(27,94,56,.15);border-color:var(--felt);}
.result-btn.lose{background:rgba(200,16,46,.12);border-color:var(--crimson);}
.rb-check{font-size:38px;line-height:1;}
.confirm-btn{background:var(--felt);color:white;border:none;width:100%;padding:15px;font-size:15px;font-weight:700;border-radius:var(--r);cursor:pointer;}

/* SCREEN 3 */
.score-strip{background:var(--felt);padding:12px 14px 10px;}
.score-teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.score-team{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;position:relative;}
.score-team.leading{background:rgba(212,164,32,.18);outline:1.5px solid rgba(212,164,32,.4);}
.st-label{font-size:9px;font-weight:700;letter-spacing:.3px;color:rgba(248,242,228,.5);display:block;margin-bottom:3px;}
.st-score{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ivory);display:block;line-height:1;}
.st-score.leading{color:var(--gold-lt);}
.st-members{font-size:9px;color:rgba(248,242,228,.35);margin-top:2px;display:block;}
.lead-pill{position:absolute;top:8px;left:8px;background:var(--gold);border-radius:4px;padding:2px 6px;font-size:8px;font-weight:800;color:var(--jet);}
.prog-bar{height:4px;background:var(--felt-lt);display:flex;}
.pb-a{height:100%;background:var(--crimson);}
.pb-b{height:100%;background:var(--purple);margin-right:auto;}
.rounds-wrap{background:var(--ivory);overflow-x:auto;}
.rt{width:100%;border-collapse:collapse;table-layout:fixed;}
.rt thead tr{background:var(--ivory-dk);}
.rt th{padding:8px 5px;font-size:9px;font-weight:700;color:#888;text-align:center;border-bottom:2px solid var(--ivory-mid);}
.rt th:nth-child(1){width:32px;}
.rt th:nth-child(2){width:38%;}
.rt th:nth-child(3){width:20%;}
.rt th:nth-child(4){width:20%;}
.rt td{padding:8px 5px;border-top:1px solid var(--ivory-dk);vertical-align:middle;text-align:center;}
.rt td:nth-child(1){font-size:11px;font-weight:700;color:#BBB;}
.col2-team{font-size:13px;font-weight:800;display:block;line-height:1.2;}
.col2-detail{font-size:9px;display:block;margin-top:2px;}
.col2-win .col2-team{color:var(--felt);}
.col2-lose .col2-team{color:var(--crimson);}
.col2-win .col2-detail{color:rgba(27,94,56,.7);}
.col2-lose .col2-detail{color:rgba(200,16,46,.7);}
.col3-pts{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;display:block;}
.col3-who{font-size:9px;color:#AAA;display:block;margin-top:1px;}
.col3-win .col3-pts{color:var(--felt);}
.col3-lose .col3-pts{color:var(--crimson);}
.col4-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.col4-a{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--crimson);}
.col4-div{width:20px;height:1px;background:var(--ivory-mid);}
.col4-b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--purple);}
.rt tfoot td{background:var(--ivory-dk);font-size:11px;font-weight:700;border-top:2px solid var(--ivory-mid);padding:8px 5px;text-align:center;}
.add-round-btn{background:var(--crimson);color:white;border:none;width:100%;padding:14px;font-size:15px;font-weight:700;cursor:pointer;}

/* SCREEN 4 */
.go-hero{background:linear-gradient(155deg,var(--felt),#0A2816);padding:28px 20px 20px;text-align:center;}
.go-trophy{font-size:52px;display:block;margin-bottom:10px;}
.go-label{font-size:12px;color:rgba(248,242,228,.45);letter-spacing:1px;margin-bottom:5px;}
.go-winner{font-size:26px;font-weight:900;color:var(--gold-lt);}
.go-sub{font-size:13px;color:rgba(248,242,228,.5);margin-top:4px;}
.standings-wrap{background:var(--ivory);}
.standing-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ivory-dk);}
.st-rank{font-size:18px;font-weight:900;color:var(--ivory-mid);width:24px;flex-shrink:0;}
.st-rank.gold{color:var(--gold);}
.st-avatars{display:flex;gap:3px;flex-shrink:0;}
.st-av{width:34px;height:34px;font-size:13px;}
.st-info{flex:1;}
.st-name{font-size:14px;font-weight:700;color:var(--jet);}
.st-players{font-size:10px;color:#AAA;margin-top:1px;}
.st-total{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}
.st-total.win{color:var(--felt);}
.st-total.lose{color:var(--crimson);}
.player-stats{background:var(--ivory-dk);padding:14px;}
.ps-title{font-size:10px;font-weight:700;color:#777;letter-spacing:.5px;text-transform:uppercase;direction:ltr;margin-bottom:10px;}
.ps-table{width:100%;border-collapse:collapse;}
.ps-table th{font-size:9px;color:#888;font-weight:700;padding:4px 6px;text-align:center;border-bottom:1px solid var(--ivory-mid);}
.ps-table th:first-child{text-align:right;}
.ps-table td{font-size:12px;padding:7px 6px;text-align:center;border-bottom:1px solid var(--ivory-mid);font-variant-numeric:tabular-nums;color:var(--jet);}
.ps-table td:first-child{text-align:right;}
.ps-table td:first-child .inner{display:flex;align-items:center;gap:7px;}
.ps-table tr:last-child td{border-bottom:none;}
.pts-given{color:var(--crimson);font-weight:700;}
.pts-won{color:var(--felt);font-weight:700;}
.pts-diff-pos{color:var(--felt);font-weight:800;}
.pts-diff-neg{color:var(--crimson);font-weight:800;}
.go-actions{display:flex;flex-direction:column;gap:8px;padding:14px 14px 20px;background:var(--ivory-dk);}
.btn-r{background:var(--crimson);color:white;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-g{background:var(--felt);color:white;border:none;border-radius:var(--r);padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-w{background:white;color:var(--jet);border:1.5px solid var(--ivory-mid);border-radius:var(--r);padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<!-- APPROVED: Kout Bo Sitta — 4 screens -->
<!-- Screen 1: Setup — 2x2/3x3 toggle, saved teams chips, team name inputs, player rows, add player, save team -->
<!-- Screen 2: Round Entry — Hakim selector, Hokm (ملزوم/5/6/7/8/باون), ✓/✕ result, confirm -->
<!-- Screen 3: Live Scoreboard — team scores header, progress bar, 4-col table (#, hakim+bid, points+who, running total) -->
<!-- Screen 4: Game Over — winner hero, team standings, per-player stats (won/given/diff), action buttons -->

<!-- SCORING RULES (saved for implementation):
  ملزوم: win = +5 bidding team, lose = +5 OTHER team
  5:     win = +5 bidding team, lose = +10 OTHER team
  6:     win = +6 bidding team, lose = +12 OTHER team
  7:     win = +7 bidding team, lose = +14 OTHER team
  8:     win = +8 bidding team, lose = +16 OTHER team
  باون:  win = +36 bidding team, lose = +18 OTHER team
-->

<!-- GENERAL RULES:
  - All numbers: Arabic numerals (1,2,3) NOT Hindi (١،٢،٣)
  - Game supports 2x2 (4 players) and 3x3 (6 players)
  - Teams can be named and saved as "ready teams"
  - Hakim = the individual player who is bidding that round
  - Column 2 of scoreboard: team name (big, green=win/red=lose) + player name + bid number (small)
  - Column 3: points number + which team receives (small)
  - Column 4: running total stacked (Team A / Team B)
  - Game Over: per-player stats showing فاز بـ / أعطى / الفرق
-->
</body>
</html>
